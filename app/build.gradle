plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arenaroyale.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.arenaroyale.game"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
