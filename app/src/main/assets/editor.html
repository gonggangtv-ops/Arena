const form=document.getElementById('signin'),field=document.getElementById('password');
const button=document.getElementById('unlock'),message=document.getElementById('message'),gate=document.getElementById('gate');
const query=new URLSearchParams(location.search);
let savedLanguage;try{savedLanguage=localStorage.getItem('ar_language')}catch{}
const en=(query.get('lang')||savedLanguage)==='en';
const words=(th,english)=>en?english:th;
const gameURL=new URL('index.html',location.href);
if(['en','th'].includes(query.get('lang')))gameURL.searchParams.set('lang',query.get('lang'));
document.documentElement.lang=en?'en':'th';
document.getElementById('play').href=gameURL.href;
if(en){
  document.getElementById('passLabel').textContent='Admin password';
  button.textContent='Open World Editor';document.getElementById('play').textContent='Back to game';
}
const bytes=base64=>Uint8Array.from(atob(base64),ch=>ch.charCodeAt(0));
const unseal=(key,box)=>crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(box.iv)},key,bytes(box.data));
let frame,attempt=0;
function reset(){
  attempt++;if(frame){frame.remove();frame=null}
  gate.hidden=false;form.reset();button.disabled=false;message.textContent='';
}
function launch(bundle){
  frame=document.createElement('iframe');frame.title='MuzCruor World Editor';
  frame.addEventListener('load',()=>{
    try{
      const game=frame.contentWindow,doc=frame.contentDocument;
      if(!game.MoonfallLoading)throw Error('runtime');
      const style=doc.createElement('style');style.textContent=bundle.css;doc.head.append(style);
      const ui=doc.createElement('template');ui.innerHTML=bundle.html;doc.body.append(ui.content);
      const script=doc.createElement('script');script.textContent=bundle.js;doc.body.append(script);
      if(!game.ArenaEditor)throw Error('editor');
      game.MoonfallLoading.whenReady.then(()=>game.ArenaEditor.open());
    }catch{reset();message.textContent=words('โหลดตัวแก้ไขเกมไม่สำเร็จ กรุณาลองอีกครั้ง','Could not load the editor. Try again.')}
  });
  frame.src=gameURL.href;document.body.append(frame);gate.hidden=true;frame.focus();
}
form.addEventListener('submit',async event=>{
  event.preventDefault();if(button.disabled)return;
  if(!window.crypto?.subtle){message.textContent=words('เปิดหน้านี้ผ่าน HTTPS หรือ localhost','Open this page over HTTPS or localhost.');return}
  button.disabled=true;const token=++attempt;
  message.textContent=words('กำลังเปิดตัวแก้ไขเกม…','Opening World Editor…');
  try{
    const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
    field.value='';
    const wrappingKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    const privateKey=await crypto.subtle.importKey('pkcs8',await unseal(wrappingKey,envelope.locked),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
    const contentKey=await crypto.subtle.decrypt({name:'RSA-OAEP'},privateKey,bytes(envelope.session));
    const key=await crypto.subtle.importKey('raw',contentKey,'AES-GCM',false,['decrypt']);
    const bundle=JSON.parse(new TextDecoder().decode(await unseal(key,envelope.payload)));
    if(token===attempt)launch(bundle);
  }catch{
    if(token===attempt){button.disabled=false;message.textContent=words('รหัสผ่านไม่ถูกต้อง','Incorrect password');field.focus()}
  }
});
window.addEventListener('pageshow',e=>{if(e.persisted)reset()});
window.addEventListener('pagehide',reset);
</script>
