name: Build APK

# APK builds are paused (the game is web-first for now). Run it by hand from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArenaRoyale.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaRoyale-apk
          path: ArenaRoyale.apk

      - name: Publish to Releases (download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arena Royale (ล่าสุด)
          files: ArenaRoyale.apk
          make_latest: true
