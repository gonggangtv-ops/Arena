name: Deploy web game (GitHub Pages)

# Copies the game files to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://<user>.github.io/<repo>/
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp app/src/main/assets/index.html app/src/main/assets/engine.min.js app/src/main/assets/models2.js app/src/main/assets/models4.js app/src/main/assets/peerjs.min.js app/src/main/assets/turn.js app/src/main/assets/sfx.js site/
          cp -r app/src/main/assets/music site/
          touch site/.nojekyll

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web game from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
