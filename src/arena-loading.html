<section id="loading" class="ov moonfall-load arena-load" data-key-art="assets/ui/arena-eclipse.webp" data-phase="loading" role="dialog" aria-modal="true" aria-labelledby="arenaLoadWordmark" tabindex="-1">
  <div class="arena-load-backdrop" aria-hidden="true">
    <div class="arena-load-art"></div>
    <div class="arena-load-light"></div>
    <div class="arena-load-mist"></div>
    <div class="arena-load-embers"></div>
  </div>
  <div class="arena-load-card">
    <h1 class="arena-wordmark" id="arenaLoadWordmark" aria-label="Arena Royale"><span>ARENA</span><span>ROYALE</span></h1>
    <div class="arena-load-rule" aria-hidden="true"></div>
    <h2 id="moonfallLoadTitle">กำลังเปิดประตูสนาม</h2>
    <p id="moonfallLoadStatus" role="status" aria-live="polite">กำลังตรวจสอบไฟล์เกม…</p>
    <div id="moonfallLoadProgress" role="progressbar" aria-label="ความคืบหน้าโหลดเกม" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="moonfallLoadFill"></div></div>
    <p id="moonfallLoadCount">กำลังเตรียมข้อมูล</p>
    <div id="moonfallLoadError" role="alert" hidden></div>
    <button id="moonfallLoadRetry" type="button" onclick="location.reload()" hidden>โหลดใหม่อีกครั้ง</button>
  </div>
</section>
