<section id="loading" class="ov moonfall-load" role="dialog" aria-modal="true" aria-labelledby="moonfallLoadTitle" tabindex="-1">
  <div class="moonfall-load-art" aria-hidden="true"></div>
  <div class="moonfall-load-card">
    <div class="moonfall-load-crest" aria-hidden="true"><span>☾</span></div>
    <p class="moonfall-load-eyebrow">THE CURSED REALM</p>
    <p class="moonfall-load-wordmark" aria-hidden="true">MOONFALL</p>
    <p class="moonfall-load-chapter">เมื่อจันทราร่วงหล่น ตำนานบทใหม่จึงเริ่มต้น</p>
    <div class="moonfall-load-rule" aria-hidden="true"><span>✦</span></div>
    <h2 id="moonfallLoadTitle">กำลังเปิดประตูจันทรา</h2>
    <p id="moonfallLoadStatus" role="status" aria-live="polite">กำลังตรวจสอบไฟล์เกม…</p>
    <div id="moonfallLoadProgress" role="progressbar" aria-label="ความคืบหน้าโหลดเกม" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="moonfallLoadFill"></div></div>
    <p id="moonfallLoadCount">กำลังเตรียมข้อมูล</p>
    <p class="moonfall-load-note">ฉาก · ผู้กล้า · พลังจันทรา<br>ประตูจะเปิดเมื่อทุกอย่างพร้อม</p>
    <div id="moonfallLoadError" role="alert" hidden></div>
    <button id="moonfallLoadRetry" type="button" onclick="location.reload()" hidden>โหลดใหม่อีกครั้ง</button>
  </div>
  <div class="moonfall-load-edition" aria-hidden="true">DARK CELESTIAL FANTASY <span>✦</span> ARENA ROYALE</div>
</section>
<script>
window.moonfallCodeFailure=function(name){
 window.__moonfallCodeFailure=name;
 document.getElementById('loading').classList.remove('hidden');
 document.getElementById('moonfallLoadStatus').textContent='โหลดไฟล์เกมไม่สำเร็จ';
 const error=document.getElementById('moonfallLoadError');error.hidden=false;error.textContent=name+' · ยังเข้าเกมไม่ได้ กรุณาโหลดใหม่';
 document.getElementById('moonfallLoadRetry').hidden=false;
 for(const id of ['menu','rooms','lobby','c']){const el=document.getElementById(id);if(el)el.inert=true;}
 for(const id of ['soloBtn','qmBtn','hostBtn','joinBtn','lobbyStart','moonfallBtn']){const el=document.getElementById(id);if(el)el.disabled=true;}
};
if(window.__moonfallCodeFailure)moonfallCodeFailure(window.__moonfallCodeFailure);
</script>
